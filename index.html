<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffb3c6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="💗밍재💗" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>민구 💗 이재 STORY</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===================== 로그인 ===================== -->
  <section id="login" class="screen login">
    <div class="login-card">
      <div class="login-heart">💕</div>
      <p class="login-tag" id="loginTag">세상에 하나뿐인</p>
      <h1 id="loginTitle">민구 💗 이재 STORY</h1>
      <p class="login-sub">둘만 들어올 수 있어요</p>
      <input id="loginEmail" type="text" inputmode="text" placeholder="아이디" autocomplete="username" autocapitalize="off" />
      <input id="loginPw" type="password" placeholder="비밀번호" autocomplete="current-password" />
      <button id="loginBtn" class="btn-primary">들어가기</button>
      <button id="signupBtn" class="btn-ghost">처음이면 여기로 (회원가입)</button>
      <p id="loginMsg" class="login-msg"></p>
    </div>
  </section>

  <!-- ===================== 메인 앱 ===================== -->
  <main id="app" class="screen app hidden">

    <header class="topbar">
      <div class="topbar-title">
        <span class="tag" id="topTag">세상에 하나뿐인</span>
        <span id="topTitle">민구 💗 이재 STORY</span>
      </div>
      <button id="logoutBtn" class="icon-btn" title="로그아웃">⏏︎</button>
    </header>

    <!-- ---------- 홈 ---------- -->
    <section class="tab" data-tab="home">
      <div class="dday-card" id="ddayCard"></div>

      <div class="card">
        <div class="card-title">다가오는 기념일 ✨</div>
        <div id="upcomingList" class="upcoming-list"></div>
      </div>

      <div class="card mood-card">
        <div class="card-title">오늘의 기분 💗</div>
        <div id="moodRow" class="mood-row"></div>
        <div class="mood-edit">
          <div id="moodPicker" class="mood-picker"></div>
          <input id="moodMsg" type="text" maxlength="40" placeholder="한마디 남기기" />
          <button id="moodSave" class="btn-small">저장</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">보고싶을 땐 콕! 👉</div>
        <input id="pokeMsg" type="text" maxlength="50" placeholder="멘트 입력 (비우면 '보고싶어! 💗')" />
        <button id="pokeBtn" class="btn-poke">콕 찌르기 💗</button>
        <div id="pokeLog" class="poke-log"></div>
      </div>

      <div class="card reco-card">
        <div class="card-title">오늘의 데이트 추천 ✨</div>
        <div class="roulette-tabs">
          <button class="rl-tab active" data-rl="activity">🎡 뭐할까</button>
          <button class="rl-tab" data-rl="food">🍽️ 뭐먹지</button>
          <button class="rl-tab" data-rl="cook">🍳 뭐해먹지</button>
        </div>
        <div id="rouletteResult" class="roulette-result">버튼을 눌러봐!</div>
        <div id="recoLinks" class="reco-links"></div>
        <button id="rouletteBtn" class="btn-primary full">추천 받기 🎰</button>
        <button id="rouletteManage" class="btn-ghost">항목 직접 추가/관리</button>
      </div>
    </section>

    <!-- ---------- 캘린더 ---------- -->
    <section class="tab hidden" data-tab="calendar">
      <div class="cal-head">
        <button id="calPrev" class="icon-btn">‹</button>
        <span id="calLabel"></span>
        <button id="calNext" class="icon-btn">›</button>
      </div>
      <div class="seg cal-seg" id="calSeg">
        <button class="seg-btn active" data-cal="all">전체</button>
        <button class="seg-btn" data-cal="anniversary">🎉기념일</button>
        <button class="seg-btn" data-cal="travel">✈️여행</button>
        <button class="seg-btn" data-cal="schedule">📅일정</button>
        <button class="seg-btn" data-cal="etc">📎기타</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>

      <div id="calDayPanel" class="card day-panel hidden"></div>

      <button id="addEventBtn" class="btn-primary full">+ 일정 추가</button>

      <div class="list-head">전체 일정 📋</div>
      <div id="eventList" class="anniv-list"></div>
    </section>

    <!-- ---------- 버킷리스트 ---------- -->
    <section class="tab hidden" data-tab="bucket">
      <div class="seg" id="bucketSeg">
        <button class="seg-btn active" data-cat="travel">✈️ 여행</button>
        <button class="seg-btn" data-cat="eat">🍜 먹고싶은</button>
        <button class="seg-btn" data-cat="buy">🛍️ 사고싶은</button>
        <button class="seg-btn" data-cat="do">⭐ 하고싶은</button>
      </div>
      <div id="bucketTools"></div>
      <button id="bucketAddBtn" class="btn-primary full">+ 추가</button>
      <div id="bucketList" class="bucket-list"></div>
      <div id="bucketProgress" class="bucket-progress"></div>
    </section>

    <!-- ---------- 추억 ---------- -->
    <section class="tab hidden" data-tab="memory">
      <div class="seg" id="memSeg">
        <button class="seg-btn active" data-mem="photos">📸 사진첩</button>
        <button class="seg-btn" data-mem="footprints">🗺️ 발자취</button>
      </div>

      <div id="memPhotos">
        <label class="btn-primary full upload-label">
          + 사진 올리기
          <input id="photoInput" type="file" accept="image/*" hidden />
        </label>
        <div id="photoGrid" class="photo-grid"></div>
      </div>

      <div id="memFootprints" class="hidden">
        <button id="addFootBtn" class="btn-primary full">+ 발자취 남기기</button>
        <div id="footTimeline" class="timeline"></div>
      </div>
    </section>

    <!-- ---------- 일기 ---------- -->
    <section class="tab hidden" data-tab="diary">
      <div class="card diary-write">
        <div id="diaryMoodPicker" class="mood-picker"></div>
        <textarea id="diaryInput" rows="3" placeholder="오늘 하고 싶은 말, 그날의 기분..."></textarea>
        <button id="diaryAdd" class="btn-primary full">남기기 💌</button>
      </div>
      <div id="diaryList" class="diary-list"></div>
    </section>

    <nav class="tabbar">
      <button class="tabbtn active" data-go="home"><span>🏠</span>홈</button>
      <button class="tabbtn" data-go="calendar"><span>📅</span>캘린더</button>
      <button class="tabbtn" data-go="bucket"><span>🪣</span>버킷</button>
      <button class="tabbtn" data-go="memory"><span>📸</span>추억</button>
      <button class="tabbtn" data-go="diary"><span>💌</span>일기</button>
    </nav>
  </main>

  <!-- 토스트 / 모달 / 라이트박스 -->
  <div id="toast" class="toast hidden"></div>
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <h3 id="modalTitle"></h3>
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button id="modalCancel" class="btn-ghost">취소</button>
        <button id="modalOk" class="btn-primary">확인</button>
      </div>
    </div>
  </div>
  <div id="lightbox" class="lightbox hidden">
    <button id="lbClose" class="lb-close">✕</button>
    <img id="lbImg" src="" alt="" />
    <div id="lbCap" class="lb-cap"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
